  <rect x="24" y="376" width="194" height="42" rx="21" fill="#A259FF"/>
  <text x="121" y="404" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">EDITABLE MASTER</text>
  <text x="238" y="404" fill="#B7C3BD" font-family="Inter,Arial,sans-serif" font-size="18">Vectors · Components · Variables</text>
  <circle cx="510" cy="397" r="18" fill="#4DBB84"/><path d="M500 397l7 7 14-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
