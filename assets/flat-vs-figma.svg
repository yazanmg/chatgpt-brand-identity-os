<text x="70" y="676" fill="#14201D" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Required end state:</text>
<text x="270" y="676" fill="#58635E" font-family="Inter,Arial,sans-serif" font-size="22">professional editable Figma master — or a tested local importer when direct writing is blocked.</text>
</svg>