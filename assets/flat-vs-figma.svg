<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Flat image versus editable Figma handoff</title>
<desc id="desc">Comparison showing a flattened brand board as an intermediate artifact and a structured editable Figma file as the required final deliverable.</desc>
<rect width="1400" height="720" rx="34" fill="#F3EEE3"/>
<text x="70" y="78" fill="#14201D" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Presentation checkpoint ≠ production handoff</text>
<text x="70" y="118" fill="#58635E" font-family="Inter,Arial,sans-serif" font-size="21">A beautiful image may approve the direction. The final system must remain editable.</text>

<g transform="translate(70 175)">
  <rect width="560" height="440" rx="28" fill="#FFFFFF" stroke="#D9D1C5" stroke-width="3"/>
  <rect x="28" y="28" width="504" height="330" rx="18" fill="#E9E3D8"/>
  <rect x="52" y="52" width="210" height="100" rx="12" fill="#14201D"/>
  <path d="M80 126c55-80 95 36 152-44" fill="none" stroke="#D53A27" stroke-width="8" stroke-linecap="round"/>
  <circle cx="82" cy="124" r="8" fill="#F3EEE3"/><circle cx="232" cy="82" r="8" fill="#F3EEE3"/>
  <rect x="286" y="52" width="220" height="100" rx="12" fill="#FFFFFF"/>
  <rect x="52" y="176" width="150" height="68" rx="12" fill="#D53A27"/>
  <rect x="218" y="176" width="136" height="68" rx="12" fill="#7D8E82"/>
  <rect x="370" y="176" width="136" height="68" rx="12" fill="#14201D"/>
  <rect x="52" y="266" width="454" height="64" rx="12" fill="#FFFFFF"/>
  <path d="M72 286h250M72 306h188" stroke="#B7AFA3" stroke-width="8" stroke-linecap="round"/>
  <rect x="28" y="376" width="166" height="42" rx="21" fill="#D53A27"/>
  <text x="111" y="404" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">FLAT IMAGE</text>
  <text x="212" y="404" fill="#7F756C" font-family="Inter,Arial,sans-serif" font-size="18">PNG / JPG / PDF</text>
  <circle cx="510" cy="397" r="18" fill="#D53A27"/><path d="M502 389l16 16M518 389l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</g>

<path d="M665 390h70" stroke="#D53A27" stroke-width="8" stroke-linecap="round"/><path d="M718 370l22 20-22 20" fill="none" stroke="#D53A27" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

