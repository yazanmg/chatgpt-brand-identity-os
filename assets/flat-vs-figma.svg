  <rect x="24" y="94" width="126" height="256" rx="14" fill="#1A2622"/>
  <path d="M42 125h88M42 157h66M42 189h80M42 221h58M42 253h92M42 285h70" stroke="#819087" stroke-width="7" stroke-linecap="round"/>
