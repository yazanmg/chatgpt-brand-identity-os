name: Bootstrap Canonical Core

on:
  push:
    paths:
      - '.github/workflows/bootstrap-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical file byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/core.gz.part*.b64 | base64 --decode > /tmp/core.gz
          gzip -dc /tmp/core.gz > MASTER_BRAND_IDENTITY_OPERATING_SYSTEM.md

      - name: Verify canonical SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='bbb4d3682b03a7125f695ec2b4288e175ea9352eb77f7e05e84feec98ce17201'
          ACTUAL="$(sha256sum MASTER_BRAND_IDENTITY_OPERATING_SYSTEM.md | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$(wc -c < MASTER_BRAND_IDENTITY_OPERATING_SYSTEM.md)" -eq 113268

      - name: Commit exact canonical core and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_BRAND_IDENTITY_OPERATING_SYSTEM.md
          git rm -r bootstrap
          git commit -m 'chore: materialize exact canonical core'
          git push
